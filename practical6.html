<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Scholarship Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        fieldset {
            border: 1px solid #ddd;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
            color: #34495e;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .inline {
            width: auto;
            margin-right: 10px;
        }

        .radio-group, .checkbox-group {
            margin-top: 8px;
        }

        .radio-group input,
        .checkbox-group input {
            margin-right: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Scholarship Registration Form</h2>

    <form>

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label>Full Name</label>
            <input type="text" name="name" required>

            <label>Date of Birth</label>
            <input type="date" name="dob" required>

            <label>Email Address</label>
            <input type="email" name="email" required>

            <label>Mobile Number</label>
            <input type="tel" name="phone" required>

            <label>Gender</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="Male" class="inline"> Male
                <input type="radio" name="gender" value="Female" class="inline"> Female
                <input type="radio" name="gender" value="Other" class="inline"> Other
            </div>
        </fieldset>

        <!-- Academic Details -->
        <fieldset>
            <legend>Academic Details</legend>

            <label>Highest Qualification</label>
            <select name="qualification" required>
                <option value="">-- Select Qualification --</option>
                <option>High School</option>
                <option>Diploma</option>
                <option>Bachelor's Degree</option>
                <option>Master's Degree</option>
            </select>

            <label>Institution Name</label>
            <input type="text" name="institution" required>

            <label>Field of Study</label>
            <input type="text" name="field" required>

            <label>Percentage / CGPA</label>
            <input type="text" name="marks" required>
        </fieldset>

        <!-- Scholarship Details -->
        <fieldset>
            <legend>Scholarship Details</legend>

            <label>Scholarship Type</label>
            <div class="radio-group">
                <input type="radio" name="scholarship" value="Merit"> Merit-Based
                <input type="radio" name="scholarship" value="Need"> Need-Based
                <input type="radio" name="scholarship" value="Sports"> Sports
            </div>

            <label>Extracurricular Activities</label>
            <div class="checkbox-group">
                <input type="checkbox" name="activity" value="Sports"> Sports
                <input type="checkbox" name="activity" value="Music"> Music
                <input type="checkbox" name="activity" value="Arts"> Arts
                <input type="checkbox" name="activity" value="Volunteering"> Volunteering
            </div>

            <label>Why do you deserve this scholarship?</label>
            <textarea rows="4" name="reason" required></textarea>
        </fieldset>

        <!-- Declaration -->
        <fieldset>
            <legend>Declaration</legend>

            <div class="checkbox-group">
                <input type="checkbox" required>
                I confirm that the above information is true and correct.
            </div>
        </fieldset>

        <button type="submit" class="submit-btn">Submit Application</button>

    </form>
</div>

</body>
</html>
