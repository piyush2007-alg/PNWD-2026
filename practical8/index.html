<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricketer Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Cricketer Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <img src="https://www.deccanchronicle.com/h-upload/2025/05/12/1917077-gqvpwx7xqaafer9.webp" alt="Virat Kohli">
                <figcaption>Virat Kohli</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://media.newindianexpress.com/newindianexpress%2F2025-04-01%2Fbc1gpp5u%2FAP25088521942501.jpg?w=480&auto=format%2Ccompress" alt="Babar Azam">
                <figcaption>Rohit Sharma</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://www.aljazeera.com/wp-content/uploads/2025/07/2025-07-25T162623Z_866326960_UP1EL7P19NXBZ_RTRMADP_3_CRICKET-TEST-ENG-IND-1753470930.jpg?resize=770%2C513&quality=80" alt="Joe Root">
                <figcaption>Joe Root</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://resize.indiatvnews.com/en/resize/newbucket/1200_-/2019/06/kw-1561868103.jpg" alt="Kane Williamson">
                <figcaption>Kane Williamson</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4a2oY6uCeHhb9VW9L-rWgtOu8MaUPqcT3aQ&s" alt="AB Devilliers">
                <figcaption>AB Devilliers</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
